name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish for a manual release"
        required: false
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # P5-09 wires release-please's real output here. Until then only edge and
  # sha-* tags are produced.
  RELEASE_CREATED: "false"

jobs:
  image:
    name: Build, scan and publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name and tags
        id: image
        env:
          IMAGE_NAME: ${{ github.event.repository.name }}
          MANUAL_TAG: ${{ github.event.inputs.tag }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME,,}"
          echo "name=${image}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "type=edge,branch=main"
            echo "type=sha"
            if [ -n "${MANUAL_TAG}" ]; then
              echo "type=raw,value=${MANUAL_TAG}"
            fi
            if [ "${RELEASE_CREATED}" = "true" ]; then
              echo "type=semver,pattern={{version}}"
              echo "type=semver,pattern={{major}}.{{minor}}"
              echo "type=raw,value=latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.title=template-api
            org.opencontainers.image.description=Headless Express API template
            org.opencontainers.image.vendor=Asterki

      - name: Build local image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.image.outputs.name }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for fixed HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
